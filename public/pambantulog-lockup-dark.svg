<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 256" width="960" height="256" role="img" aria-labelledby="title-lockup-dark">
  <title id="title-lockup-dark">PambantuLog Horizontal Lockup (Dark Mode)</title>
  <g id="symbol" transform="translate(64, 38) scale(0.703)">
    <!-- Vertical Timeline / Audit Log Stem (White on Dark) -->
    <rect x="48" y="36" width="44" height="184" rx="4" fill="#FFFFFF"/>
    <!-- Ticket Loop with Incident Punch Notch (Golden Amber) -->
    <path fill="#DCA12D" fill-rule="evenodd" d="
      M 98 36
      H 144
      A 64 64 0 0 1 206 76
      A 16 16 0 0 0 206 108
      A 64 64 0 0 1 144 148
      H 98
      Z
      M 98 72
      H 144
      A 20 20 0 0 1 164 92
      A 20 20 0 0 1 144 112
      H 98
      Z
    "/>
  </g>
  <!-- Wordmark: PambantuLog for dark backgrounds -->
  <text x="248" y="156" font-family="'Google Sans Flex', 'Google Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#FFFFFF">Pambantu</tspan><tspan fill="#DCA12D">Log</tspan>
  </text>
</svg>
